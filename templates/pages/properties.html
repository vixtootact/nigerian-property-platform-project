<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browse Properties - NaijaHomes</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

<nav class="navbar" id="navbar"></nav>

<div class="page-header">
    <div class="container">
        <div class="page-title">Browse Properties</div>
        <div class="page-subtitle">Find your perfect home across Nigeria</div>
    </div>
</div>

<div class="container" style="padding-bottom:3rem;">

    <div class="card" style="margin-bottom:2rem;">
        <div class="card-body">

            <div style="display:flex; gap:1rem; margin-bottom:1rem; align-items:flex-end;">
                <div style="flex:2;">
                    <label class="form-label">Search</label>
                    <div style="display:flex; border:1.5px solid var(--border);
                                border-radius:8px; overflow:hidden; background:white;">
                        <span style="padding:0.75rem 1rem; color:var(--text-muted);">🔍</span>
                        <input type="text" id="searchInput"
                               style="flex:1; border:none; outline:none; font-family:inherit;
                                      font-size:0.9rem; color:var(--text-main); background:transparent;"
                               placeholder="Search by title, location...">
                    </div>
                </div>
                <div>
                    <label class="form-label">State</label>
                    <select id="stateFilter" class="form-control" style="min-width:140px;">
                        <option value="">All States</option>
                        <option>Lagos</option>
                        <option>Abuja</option>
                        <option>Rivers</option>
                        <option>Enugu</option>
                        <option>Oyo</option>
                        <option>Edo</option>
                    </select>
                </div>
                <div>
                    <label class="form-label">Type</label>
                    <select id="typeFilter" class="form-control" style="min-width:140px;">
                        <option value="">All Types</option>
                        <option value="apartment">Apartment</option>
                        <option value="duplex">Duplex</option>
                        <option value="bungalow">Bungalow</option>
                        <option value="self-contain">Self Contain</option>
                        <option value="room">Room</option>
                        <option value="mansion">Mansion</option>
                    </select>
                </div>
            </div>

            <div style="display:flex; gap:1rem; align-items:flex-end; flex-wrap:wrap;">
                <div>
                    <label class="form-label">Min Price (₦)</label>
                    <input type="number" id="minPrice" class="form-control"
                           style="width:150px;" placeholder="e.g. 100000">
                </div>
                <div>
                    <label class="form-label">Max Price (₦)</label>
                    <input type="number" id="maxPrice" class="form-control"
                           style="width:150px;" placeholder="e.g. 5000000">
                </div>
                <div>
                    <label class="form-label">Status</label>
                    <select id="statusFilter" class="form-control" style="width:140px;">
                        <option value="">All</option>
                        <option value="available">Available</option>
                        <option value="rented">Rented</option>
                    </select>
                </div>
                <div style="margin-left:auto; display:flex; gap:0.7rem; align-items:flex-end;">
                    <button class="btn btn-primary" onclick="applyFilters()">
                        🔍 Search
                    </button>
                    <button class="btn btn-outline" onclick="clearFilters()">
                        Clear
                    </button>
                    <a href="/api/properties/export/csv/"
                       class="btn btn-outline">⬇️ CSV</a>
                </div>
            </div>

        </div>
    </div>

    <p id="resultsCount"
       style="color:var(--text-muted); font-size:0.88rem; margin-bottom:1.2rem;"></p>

    <div class="grid-3" id="propertiesGrid">
        <div class="spinner">Loading properties...</div>
    </div>

</div>

<footer>
    <p>© 2026 NaijaHomes — Nigerian Property & Rental Management Platform</p>
</footer>

<script src="/static/js/main.js"></script>
<script>
    const propertyImages = {
        'apartment':    'https://images.unsplash.com/photo-1545324418-cc1a3fa10c00?w=500&auto=format&fit=crop&q=70',
        'duplex':       'https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?w=500&auto=format&fit=crop&q=70',
        'bungalow':     'https://images.unsplash.com/photo-1570129477492-45c003edd2be?w=500&auto=format&fit=crop&q=70',
        'self-contain': 'https://images.unsplash.com/photo-1583608205776-bfd35f0d9f83?w=500&auto=format&fit=crop&q=70',
        'room':         'https://images.unsplash.com/photo-1522708323590-d24dbb6b0267?w=500&auto=format&fit=crop&q=70',
        'mansion':      'https://images.unsplash.com/photo-1613490493576-7fde63acd811?w=500&auto=format&fit=crop&q=70',
    };

    function getPropertyImage(type, imageUrl) {
        if (imageUrl && imageUrl.startsWith('http')) return imageUrl;
        return propertyImages[type] || propertyImages['apartment'];
    }

    async function loadProperties(params = '') {
        const grid = document.getElementById('propertiesGrid');
        grid.innerHTML = '<div class="spinner">Loading properties...</div>';

        const result = await apiGet(`/properties/${params}`);

        if (!result.ok) {
            grid.innerHTML = '<p style="color:red;">Could not load properties.</p>';
            return;
        }

        const properties = result.data.properties;
        const count = properties.length;
        document.getElementById('resultsCount').textContent =
            `Showing ${count} propert${count === 1 ? 'y' : 'ies'}`;

        if (count === 0) {
            grid.innerHTML = `
                <div class="empty-state" style="grid-column:1/-1;">
                    <div class="empty-state-icon">🔍</div>
                    <p>No properties match your search.</p>
                    <button class="btn btn-outline" onclick="clearFilters()"
                            style="margin-top:1rem;">Clear Filters</button>
                </div>`;
            return;
        }

        grid.innerHTML = properties.map(p => `
            <div class="property-card"
                 onclick="window.location.href='/property-detail/?id=${p.id}'">
                <div class="property-card-image">
                    <img src="${getPropertyImage(p.property_type, p.image_url)}"
                         alt="${p.title}"
                         onerror="this.src='${propertyImages.apartment}'">
                    <div class="property-type-tag">${p.property_type}</div>
                </div>
                <div class="property-card-body">
                    <div class="property-card-title">${p.title}</div>
                    <div class="property-card-location">📍 ${p.location}, ${p.state}</div>
                    <div class="property-card-price">
                        ${formatPrice(p.price)}<span>/ year</span>
                    </div>
                    <div class="property-card-footer">
                        <div class="meta-icons">
                            <span>🛏️ ${p.bedrooms} Beds</span>
                            <span>🚿 ${p.bathrooms} Baths</span>
                        </div>
                        ${statusBadge(p.status)}
                    </div>
                </div>
            </div>
        `).join('');
    }

    function applyFilters() {
        const params = new URLSearchParams();
        const search   = document.getElementById('searchInput').value.trim();
        const state    = document.getElementById('stateFilter').value;
        const type     = document.getElementById('typeFilter').value;
        const minPrice = document.getElementById('minPrice').value;
        const maxPrice = document.getElementById('maxPrice').value;
        const status   = document.getElementById('statusFilter').value;

        if (search)   params.append('search',    search);
        if (state)    params.append('state',     state);
        if (type)     params.append('type',      type);
        if (minPrice) params.append('min_price', minPrice);
        if (maxPrice) params.append('max_price', maxPrice);
        if (status)   params.append('status',    status);

        loadProperties(params.toString() ? '?' + params.toString() : '');
    }

    function clearFilters() {
        document.getElementById('searchInput').value = '';
        document.getElementById('stateFilter').value = '';
        document.getElementById('typeFilter').value  = '';
        document.getElementById('minPrice').value    = '';
        document.getElementById('maxPrice').value    = '';
        document.getElementById('statusFilter').value = '';
        loadProperties();
    }

    document.addEventListener('DOMContentLoaded', () => {
        const urlParams = new URLSearchParams(window.location.search);
        const search = urlParams.get('search');
        const type   = urlParams.get('type');

        if (search) {
            document.getElementById('searchInput').value = search;
            applyFilters();
        } else if (type) {
            document.getElementById('typeFilter').value = type;
            applyFilters();
        } else {
            loadProperties();
        }
    });
</script>
</body>
</html>
