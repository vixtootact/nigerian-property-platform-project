<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Statistics - NaijaHomes</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

    <nav class="navbar" id="navbar"></nav>

    <div class="page-header">
        <div class="container">
            <div class="page-title">📊 Property Statistics</div>
            <div class="page-subtitle">Platform-wide data and analytics</div>
        </div>
    </div>

    <div class="container" style="padding-bottom:3rem;">

        <div class="grid-4" style="margin-bottom:2rem;">
            <div class="stat-card">
                <div class="stat-card-number" id="totalProps">-</div>
                <div class="stat-card-label">Total Properties</div>
            </div>
            <div class="stat-card">
                <div class="stat-card-number" id="availableProps">-</div>
                <div class="stat-card-label">Available</div>
            </div>
            <div class="stat-card">
                <div class="stat-card-number" id="rentedProps">-</div>
                <div class="stat-card-label">Rented</div>
            </div>
            <div class="stat-card">
                <div class="stat-card-number" id="totalStates">-</div>
                <div class="stat-card-label">States Covered</div>
            </div>
        </div>

        <div class="grid-2" style="gap:2rem; margin-bottom:2rem;">

            <div class="card">
                <div class="card-body">
                    <h3 style="font-weight:700; margin-bottom:1rem;">Properties by State</h3>
                    <div id="byStateChart"></div>
                </div>
            </div>

            <div class="card">
                <div class="card-body">
                    <h3 style="font-weight:700; margin-bottom:1rem;">Properties by Type</h3>
                    <div id="byTypeChart"></div>
                </div>
            </div>

        </div>

        <div class="card" style="margin-bottom:2rem;">
            <div class="card-body">
                <h3 style="font-weight:700; margin-bottom:1rem;">Average Annual Rent by State</h3>
                <div id="avgPriceChart"></div>
            </div>
        </div>

        <div class="card">
            <div class="card-body">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem;">
                    <h3 style="font-weight:700;">All Properties Data</h3>
                    <a href="/api/properties/export/csv/" class="btn btn-outline">⬇️ Export CSV</a>
                </div>
                <div id="allPropertiesTable">
                    <div class="spinner">Loading...</div>
                </div>
            </div>
        </div>

    </div>

    <footer>
        <p>© 2024 NaijaHomes - Nigerian Property & Rental Management Platform</p>
    </footer>

    <script src="/static/js/main.js"></script>
    <script>
        function drawBarChart(containerId, data, labelKey, valueKey, color = '#1a6b3c') {
            const container = document.getElementById(containerId);
            const max = Math.max(...data.map(d => d[valueKey]));

            container.innerHTML = data.map(d => `
                <div style="display:flex; align-items:center; gap:1rem; margin-bottom:0.8rem;">
                    <div style="width:120px; font-size:0.85rem; color:#495057; flex-shrink:0;">
                        ${d[labelKey]}
                    </div>
                    <div style="flex:1; background:#f1f3f5; border-radius:4px; height:28px; position:relative;">
                        <div style="
                            width:${(d[valueKey] / max * 100)}%;
                            background:${color};
                            height:100%;
                            border-radius:4px;
                            display:flex;
                            align-items:center;
                            justify-content:flex-end;
                            padding-right:8px;
                            color:white;
                            font-size:0.8rem;
                            font-weight:600;
                            min-width:30px;
                            transition: width 0.5s ease;
                        ">
                            ${d[valueKey]}
                        </div>
                    </div>
                </div>
            `).join('');
        }

        async function loadStats() {
            const result = await apiGet('/properties/stats/summary/');

            if (!result.ok) {
                document.getElementById('byStateChart').innerHTML =
                    '<p style="color:red;">Could not load statistics.</p>';
                return;
            }

            const stats = result.data;

            document.getElementById('totalProps').textContent  = stats.total_properties;
            document.getElementById('totalStates').textContent = stats.by_state.length;

            const available = stats.by_status.find(s => s.status === 'available');
            const rented    = stats.by_status.find(s => s.status === 'rented');
            document.getElementById('availableProps').textContent = available ? available.count : 0;
            document.getElementById('rentedProps').textContent    = rented ? rented.count : 0;

            drawBarChart('byStateChart', stats.by_state, 'state', 'count', '#1a6b3c');
            drawBarChart('byTypeChart',  stats.by_type,  'property_type', 'count', '#f0a500');

            const priceData = stats.avg_price_by_state.map(s => ({
                state: s.state,
                price: Math.round(s.avg_price / 1000)
            }));
            drawBarChart('avgPriceChart', priceData, 'state', 'price', '#2d9b5e');

            document.getElementById('avgPriceChart').insertAdjacentHTML(
                'afterend',
                '<p style="color:#6c757d; font-size:0.8rem; margin-top:0.5rem;">* Values in thousands (₦000)</p>'
            );
        }

        async function loadTable() {
            const result = await apiGet('/properties/');
            if (!result.ok) return;

            const props = result.data.properties;

            document.getElementById('allPropertiesTable').innerHTML = `
                <table class="table">
                    <thead>
                        <tr>
                            <th>Title</th>
                            <th>Type</th>
                            <th>Location</th>
                            <th>State</th>
                            <th>Price</th>
                            <th>Beds</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${props.map(p => `
                            <tr>
                                <td>${p.title}</td>
                                <td>${p.property_type}</td>
                                <td>${p.location}</td>
                                <td>${p.state}</td>
                                <td>${formatPrice(p.price)}</td>
                                <td>${p.bedrooms}</td>
                                <td>${statusBadge(p.status)}</td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>`;
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadStats();
            loadTable();
        });
    </script>
</body>
</html>
