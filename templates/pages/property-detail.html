<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Property Details - NaijaHomes</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

    <nav class="navbar" id="navbar"></nav>

    <div class="container" style="padding:2rem 1.5rem 3rem;">

        <!-- Back button -->
        <a href="/properties/" style="color:#1a6b3c; font-size:0.9rem; display:inline-block; margin-bottom:1.5rem;">
            ← Back to Properties
        </a>

        <!-- Property content loads here -->
        <div id="propertyContent">
            <div class="spinner">Loading property details...</div>
        </div>

    </div>

    <footer>
        <p>© 2024 NaijaHomes - Nigerian Property & Rental Management Platform</p>
    </footer>

    <script src="/static/js/main.js"></script>
    <script>
        async function loadProperty() {
            // Get property ID from the URL e.g. ?id=5
            const id = getParam('id');
            if (!id) {
                document.getElementById('propertyContent').innerHTML =
                    '<p style="color:red;">No property ID provided.</p>';
                return;
            }

            const result = await apiGet(`/properties/${id}/`);

            if (!result.ok) {
                document.getElementById('propertyContent').innerHTML =
                    '<p style="color:red;">Property not found.</p>';
                return;
            }

            const p = result.data.property;
            const user = getUser();

            // Check if current user is the landlord of this property
            const isOwner = user && user.id === p.landlord_id;

            // Build the property detail page
            document.getElementById('propertyContent').innerHTML = `
                <div class="grid-2" style="gap:2rem; align-items:start;">

                    <!-- LEFT: Property Image and Details -->
                    <div>
                        <!-- Large image/icon display -->
                        <div style="background:#e9ecef; border-radius:10px; height:300px;
                                    display:flex; align-items:center; justify-content:center;
                                    font-size:6rem; margin-bottom:1.5rem;">
                            ${propertyIcon(p.property_type)}
                        </div>

                        <!-- Property info card -->
                        <div class="card">
                            <div class="card-body">
                                <h2 style="font-size:1.4rem; font-weight:700; margin-bottom:0.5rem;">${p.title}</h2>
                                <p style="color:#6c757d; margin-bottom:1rem;">📍 ${p.location}, ${p.state}</p>

                                <div style="font-size:1.8rem; font-weight:700; color:#1a6b3c; margin-bottom:1rem;">
                                    ${formatPrice(p.price)}<span style="font-size:1rem; color:#6c757d;">/year</span>
                                </div>

                                <!-- Status badge -->
                                <div style="margin-bottom:1.5rem;">${statusBadge(p.status)}</div>

                                <!-- Key details grid -->
                                <div class="grid-2" style="gap:1rem; margin-bottom:1.5rem;">
                                    <div style="background:#f8f9fa; padding:1rem; border-radius:8px; text-align:center;">
                                        <div style="font-size:1.5rem;">🛏️</div>
                                        <div style="font-weight:600;">${p.bedrooms}</div>
                                        <div style="font-size:0.8rem; color:#6c757d;">Bedrooms</div>
                                    </div>
                                    <div style="background:#f8f9fa; padding:1rem; border-radius:8px; text-align:center;">
                                        <div style="font-size:1.5rem;">🚿</div>
                                        <div style="font-weight:600;">${p.bathrooms}</div>
                                        <div style="font-size:0.8rem; color:#6c757d;">Bathrooms</div>
                                    </div>
                                    <div style="background:#f8f9fa; padding:1rem; border-radius:8px; text-align:center;">
                                        <div style="font-size:1.5rem;">🏠</div>
                                        <div style="font-weight:600;">${p.property_type}</div>
                                        <div style="font-size:0.8rem; color:#6c757d;">Type</div>
                                    </div>
                                    <div style="background:#f8f9fa; padding:1rem; border-radius:8px; text-align:center;">
                                        <div style="font-size:1.5rem;">📍</div>
                                        <div style="font-weight:600;">${p.lga || 'N/A'}</div>
                                        <div style="font-size:0.8rem; color:#6c757d;">LGA</div>
                                    </div>
                                </div>

                                <!-- Description -->
                                <h3 style="font-weight:600; margin-bottom:0.5rem;">Description</h3>
                                <p style="color:#6c757d; line-height:1.7;">${p.description || 'No description provided.'}</p>

                                <!-- Listed date -->
                                <p style="color:#adb5bd; font-size:0.8rem; margin-top:1rem;">
                                    Listed on ${formatDate(p.created_at)}
                                </p>
                            </div>
                        </div>
                    </div>

                    <!-- RIGHT: Landlord info and Application form -->
                    <div>
                        <!-- Landlord contact card -->
                        <div class="card" style="margin-bottom:1.5rem;">
                            <div class="card-body">
                                <h3 style="font-weight:700; margin-bottom:1rem;">Listed By</h3>
                                <div style="display:flex; align-items:center; gap:1rem;">
                                    <div style="background:#1a6b3c; color:white; width:50px; height:50px;
                                                border-radius:50%; display:flex; align-items:center;
                                                justify-content:center; font-size:1.3rem; font-weight:700;">
                                        ${p.landlord_name ? p.landlord_name[0] : 'L'}
                                    </div>
                                    <div>
                                        <div style="font-weight:600;">${p.landlord_name || 'Landlord'}</div>
                                        <div style="color:#6c757d; font-size:0.85rem;">Property Owner</div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Owner actions (edit/delete) -->
                        ${isOwner ? `
                        <div class="card" style="margin-bottom:1.5rem;">
                            <div class="card-body">
                                <h3 style="font-weight:700; margin-bottom:1rem;">Manage Property</h3>
                                <div style="display:flex; gap:1rem; flex-wrap:wrap;">
                                    <a href="/edit-property/?id=${p.id}" class="btn btn-secondary">✏️ Edit</a>
                                    <button class="btn btn-danger" onclick="deleteProperty(${p.id})">🗑️ Delete</button>
                                </div>
                            </div>
                        </div>` : ''}

                        <!-- Application form (for tenants only) -->
                        ${(!user) ? `
                            <div class="card">
                                <div class="card-body" style="text-align:center;">
                                    <p style="margin-bottom:1rem; color:#6c757d;">Login to apply for this property</p>
                                    <a href="/login/" class="btn btn-primary btn-full">Login to Apply</a>
                                </div>
                            </div>
                        ` : (!isOwner && p.status === 'available') ? `
                            <div class="card">
                                <div class="card-body">
                                    <h3 style="font-weight:700; margin-bottom:1rem;">Apply for This Property</h3>
                                    <div id="appAlert" class="alert"></div>
                                    <div class="form-group">
                                        <label class="form-label">Message to Landlord (Optional)</label>
                                        <textarea id="appMessage" class="form-control" rows="4"
                                            placeholder="Introduce yourself and explain why you are interested..."></textarea>
                                    </div>
                                    <button class="btn btn-primary btn-full" onclick="submitApplication(${p.id})">
                                        Submit Application
                                    </button>
                                </div>
                            </div>
                        ` : (!isOwner && p.status !== 'available') ? `
                            <div class="card">
                                <div class="card-body" style="text-align:center;">
                                    <p style="color:#dc3545; font-weight:600;">This property is no longer available.</p>
                                </div>
                            </div>
                        ` : ''}
                    </div>
                </div>
            `;
        }

        async function submitApplication(propertyId) {
            const user = getUser();
            const message = document.getElementById('appMessage').value.trim();

            const result = await apiPost('/applications/', {
                property_id: propertyId,
                tenant_id: user.id,
                message: message
            });

            if (result.ok) {
                showSuccess('appAlert', 'Application submitted successfully! The landlord will review it.');
                setTimeout(() => window.location.href = '/applications/', 2000);
            } else {
                showError('appAlert', result.data.error || 'Application failed.');
            }
        }

        async function deleteProperty(propertyId) {
            if (!confirm('Are you sure you want to delete this property? This cannot be undone.')) return;

            const result = await apiDelete(`/properties/${propertyId}/`);
            if (result.ok) {
                alert('Property deleted successfully.');
                window.location.href = '/dashboard/';
            } else {
                alert('Could not delete property: ' + result.data.error);
            }
        }

        document.addEventListener('DOMContentLoaded', loadProperty);
    </script>
</body>
</html>
