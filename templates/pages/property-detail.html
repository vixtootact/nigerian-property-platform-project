<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Property Details - NaijaHomes</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

<nav class="navbar" id="navbar"></nav>

<div class="container" style="padding:2rem 1.5rem 4rem;">

    <a href="/properties/"
       style="color:var(--text-muted); font-size:0.88rem;
              display:inline-flex; align-items:center; gap:0.3rem;
              margin-bottom:1.5rem;">
        ← Back to Properties
    </a>

    <div id="propertyContent">
        <div class="spinner">Loading property...</div>
    </div>

</div>

<footer>
    <p>© 2026 NaijaHomes — Nigerian Property & Rental Management Platform</p>
</footer>

<script src="/static/js/main.js"></script>
<script>
    const propertyImages = {
        'apartment':    'https://images.unsplash.com/photo-1545324418-cc1a3fa10c00?w=900&auto=format&fit=crop&q=80',
        'duplex':       'https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?w=900&auto=format&fit=crop&q=80',
        'bungalow':     'https://images.unsplash.com/photo-1570129477492-45c003edd2be?w=900&auto=format&fit=crop&q=80',
        'self-contain': 'https://images.unsplash.com/photo-1583608205776-bfd35f0d9f83?w=900&auto=format&fit=crop&q=80',
        'room':         'https://images.unsplash.com/photo-1522708323590-d24dbb6b0267?w=900&auto=format&fit=crop&q=80',
        'mansion':      'https://images.unsplash.com/photo-1613490493576-7fde63acd811?w=900&auto=format&fit=crop&q=80',
    };

    function getPropertyImage(type, imageUrl) {
        if (imageUrl && imageUrl.startsWith('http')) return imageUrl;
        return propertyImages[type] || propertyImages['apartment'];
    }

    async function loadProperty() {
        const id = getParam('id');
        if (!id) {
            document.getElementById('propertyContent').innerHTML =
                '<p style="color:red;">No property ID provided.</p>';
            return;
        }

        const result = await apiGet(`/properties/${id}/`);
        if (!result.ok) {
            document.getElementById('propertyContent').innerHTML =
                '<p style="color:red;">Property not found.</p>';
            return;
        }

        const p    = result.data.property;
        const user = getUser();
        const isOwner = user && user.id === p.landlord_id;
        const imgSrc  = getPropertyImage(p.property_type, p.image_url);

        document.getElementById('propertyContent').innerHTML = `

            <div style="width:100%; height:420px; border-radius:var(--radius);
                        overflow:hidden; margin-bottom:2rem; position:relative;">
                <img src="${imgSrc}" alt="${p.title}"
                     style="width:100%; height:100%; object-fit:cover;"
                     onerror="this.src='${propertyImages.apartment}'">
                <div style="position:absolute; top:1rem; left:1rem;">
                    ${statusBadge(p.status)}
                </div>
                <div class="property-type-tag" style="top:1rem; left:auto; right:1rem; left:unset;">
                    ${p.property_type}
                </div>
            </div>

            <div class="grid-2" style="gap:2rem; align-items:start;">

                <div>
                    <h1 style="font-size:1.6rem; font-weight:700; color:var(--text-main);
                                margin-bottom:0.5rem;">${p.title}</h1>
                    <p style="color:var(--text-muted); margin-bottom:1rem;">
                        📍 ${p.location}, ${p.state}
                        ${p.lga ? `· ${p.lga}` : ''}
                    </p>

                    <div style="font-size:2rem; font-weight:700; color:var(--primary);
                                margin-bottom:1.5rem;">
                        ${formatPrice(p.price)}
                        <span style="font-size:1rem; color:var(--text-muted); font-weight:400;">
                            / year
                        </span>
                    </div>

                    <div style="display:grid; grid-template-columns:repeat(4,1fr);
                                gap:1rem; margin-bottom:2rem;">
                        ${[
                            ['🛏️', p.bedrooms, 'Bedrooms'],
                            ['🚿', p.bathrooms, 'Bathrooms'],
                            ['🏠', p.property_type, 'Type'],
                            ['📍', p.state, 'State']
                        ].map(([icon, val, label]) => `
                            <div style="background:var(--cream-dark); border-radius:10px;
                                        padding:1rem; text-align:center;">
                                <div style="font-size:1.4rem;">${icon}</div>
                                <div style="font-weight:700; color:var(--text-main);
                                            font-size:0.95rem; margin-top:0.3rem;
                                            text-transform:capitalize;">${val}</div>
                                <div style="font-size:0.75rem; color:var(--text-muted);">${label}</div>
                            </div>
                        `).join('')}
                    </div>

                    <div class="card" style="margin-bottom:1.5rem;">
                        <div class="card-body">
                            <h3 style="font-weight:700; margin-bottom:0.8rem;
                                       color:var(--text-main);">About This Property</h3>
                            <p style="color:var(--text-light); line-height:1.8; font-size:0.92rem;">
                                ${p.description || 'No description provided.'}
                            </p>
                        </div>
                    </div>

                    <p style="color:var(--text-muted); font-size:0.8rem;">
                        Listed on ${formatDate(p.created_at)}
                    </p>
                </div>

                <div>

                    <div class="card" style="margin-bottom:1.5rem;">
                        <div class="card-body">
                            <h3 style="font-weight:700; margin-bottom:1rem;
                                       color:var(--text-main);">Listed By</h3>
                            <div style="display:flex; align-items:center; gap:1rem;">
                                <div style="width:52px; height:52px; background:var(--primary);
                                            color:white; border-radius:50%; display:flex;
                                            align-items:center; justify-content:center;
                                            font-size:1.4rem; font-weight:700; flex-shrink:0;">
                                    ${p.landlord_name ? p.landlord_name[0].toUpperCase() : 'L'}
                                </div>
                                <div>
                                    <div style="font-weight:700; color:var(--text-main);">
                                        ${p.landlord_name || 'Landlord'}
                                    </div>
                                    <div style="color:var(--text-muted); font-size:0.83rem;">
                                        Property Owner
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    ${isOwner ? `
                    <div class="card" style="margin-bottom:1.5rem;">
                        <div class="card-body">
                            <h3 style="font-weight:700; margin-bottom:1rem;
                                       color:var(--text-main);">Manage Property</h3>
                            <div style="display:flex; gap:0.8rem;">
                                <a href="/edit-property/?id=${p.id}"
                                   class="btn btn-secondary" style="flex:1; justify-content:center;">
                                    ✏️ Edit
                                </a>
                                <button class="btn btn-danger" style="flex:1;"
                                        onclick="deleteProperty(${p.id})">
                                    🗑️ Delete
                                </button>
                            </div>
                        </div>
                    </div>` : ''}

                    ${!user ? `
                        <div class="card">
                            <div class="card-body" style="text-align:center; padding:2rem;">
                                <div style="font-size:2.5rem; margin-bottom:1rem;">🔐</div>
                                <p style="color:var(--text-muted); margin-bottom:1.2rem;">
                                    Login to apply for this property
                                </p>
                                <a href="/login/" class="btn btn-primary btn-full">
                                    Login to Apply
                                </a>
                            </div>
                        </div>
                    ` : !isOwner && p.status === 'available' ? `
                        <div class="card">
                            <div class="card-body">
                                <h3 style="font-weight:700; margin-bottom:1rem;
                                           color:var(--text-main);">Apply for This Property</h3>
                                <div id="appAlert" class="alert"></div>
                                <div class="form-group">
                                    <label class="form-label">Message to Landlord (Optional)</label>
                                    <textarea id="appMessage" class="form-control" rows="4"
                                        placeholder="Introduce yourself and explain why you are a good tenant...">
                                    </textarea>
                                </div>
                                <button class="btn btn-primary btn-full"
                                        onclick="submitApplication(${p.id})">
                                    📋 Submit Application
                                </button>
                            </div>
                        </div>
                    ` : !isOwner ? `
                        <div class="card">
                            <div class="card-body" style="text-align:center; padding:2rem;">
                                <div style="font-size:2.5rem; margin-bottom:0.8rem;">🔒</div>
                                <p style="color:#dc3545; font-weight:600;">
                                    This property is no longer available.
                                </p>
                            </div>
                        </div>
                    ` : ''}

                </div>
            </div>

            <div style="margin-top:3rem;">
                <div class="section-title" style="margin-bottom:0.3rem;">Similar Properties</div>
                <div class="section-sub">Other properties you might like</div>
                <div class="grid-3" id="similarProperties">
                    <div class="spinner">Loading...</div>
                </div>
            </div>
        `;

        loadSimilar(p.property_type, p.state, p.id);
    }

    async function loadSimilar(type, state, currentId) {
        const result = await apiGet(`/properties/?type=${type}&state=${state}`);
        const container = document.getElementById('similarProperties');

        if (!result.ok) { container.innerHTML = ''; return; }

        const similar = result.data.properties
            .filter(p => p.id !== parseInt(currentId))
            .slice(0, 3);

        if (similar.length === 0) {
            container.innerHTML = `
                <div style="grid-column:1/-1; color:var(--text-muted); font-size:0.9rem;">
                    No similar properties found.
                </div>`;
            return;
        }

        container.innerHTML = similar.map(p => `
            <div class="property-card"
                 onclick="window.location.href='/property-detail/?id=${p.id}'">
                <div class="property-card-image">
                    <img src="${getPropertyImage(p.property_type, p.image_url)}"
                         alt="${p.title}"
                         onerror="this.src='${propertyImages.apartment}'">
                    <div class="property-type-tag">${p.property_type}</div>
                </div>
                <div class="property-card-body">
                    <div class="property-card-title">${p.title}</div>
                    <div class="property-card-location">📍 ${p.location}, ${p.state}</div>
                    <div class="property-card-price">
                        ${formatPrice(p.price)}<span>/ year</span>
                    </div>
                    <div class="property-card-footer">
                        <div class="meta-icons">
                            <span>🛏️ ${p.bedrooms}</span>
                            <span>🚿 ${p.bathrooms}</span>
                        </div>
                        ${statusBadge(p.status)}
                    </div>
                </div>
            </div>
        `).join('');
    }

    async function submitApplication(propertyId) {
        const user    = getUser();
        const message = document.getElementById('appMessage').value.trim();

        const result = await apiPost('/applications/', {
            property_id: propertyId,
            tenant_id:   user.id,
            message:     message
        });

        if (result.ok) {
            showSuccess('appAlert', 'Application submitted! The landlord will review it.');
            setTimeout(() => window.location.href = '/applications/', 2000);
        } else {
            showError('appAlert', result.data.error || 'Application failed.');
        }
    }

    async function deleteProperty(propertyId) {
        if (!confirm('Delete this property? This cannot be undone.')) return;
        const result = await apiDelete(`/properties/${propertyId}/`);
        if (result.ok) {
            alert('Property deleted.');
            window.location.href = '/dashboard/';
        } else {
            alert('Could not delete: ' + result.data.error);
        }
    }

    document.addEventListener('DOMContentLoaded', loadProperty);
</script>
</body>
</html>
