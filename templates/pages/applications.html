<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Applications - NaijaHomes</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

    <nav class="navbar" id="navbar"></nav>

    <div class="page-header">
        <div class="container">
            <div class="page-title">My Applications</div>
            <div class="page-subtitle">Track all your rental applications</div>
        </div>
    </div>

    <div class="container" style="padding-bottom:3rem;">

        <div class="grid-4" style="margin-bottom:2rem;" id="appStats">
            <div class="stat-card">
                <div class="stat-card-number" id="totalApps">-</div>
                <div class="stat-card-label">Total Applications</div>
            </div>
            <div class="stat-card">
                <div class="stat-card-number" id="pendingApps">-</div>
                <div class="stat-card-label">Pending</div>
            </div>
            <div class="stat-card">
                <div class="stat-card-number" id="approvedApps">-</div>
                <div class="stat-card-label">Approved</div>
            </div>
            <div class="stat-card">
                <div class="stat-card-number" id="rejectedApps">-</div>
                <div class="stat-card-label">Rejected</div>
            </div>
        </div>

        <div class="card">
            <div class="card-body">
                <h3 style="font-weight:700; margin-bottom:1rem;">Application History</h3>
                <div id="appsList">
                    <div class="spinner">Loading applications...</div>
                </div>
            </div>
        </div>

    </div>

    <footer>
        <p>© 2024 NaijaHomes - Nigerian Property & Rental Management Platform</p>
    </footer>

    <script src="/static/js/main.js"></script>
    <script>
        requireLogin();
        const user = getUser();

        async function loadApplications() {
            const result = await apiGet(`/applications/tenant/${user.id}/`);

            if (!result.ok) {
                document.getElementById('appsList').innerHTML =
                    '<p style="color:red;">Could not load applications.</p>';
                return;
            }

            const apps = result.data.applications;

            document.getElementById('totalApps').textContent    = apps.length;
            document.getElementById('pendingApps').textContent  = apps.filter(a => a.status === 'pending').length;
            document.getElementById('approvedApps').textContent = apps.filter(a => a.status === 'approved').length;
            document.getElementById('rejectedApps').textContent = apps.filter(a => a.status === 'rejected').length;

            if (apps.length === 0) {
                document.getElementById('appsList').innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📋</div>
                        <p>You have not applied for any property yet.</p>
                        <a href="/properties/" class="btn btn-primary" style="margin-top:1rem;">
                            Browse Properties
                        </a>
                    </div>`;
                return;
            }

            document.getElementById('appsList').innerHTML = `
                <table class="table">
                    <thead>
                        <tr>
                            <th>Property</th>
                            <th>Location</th>
                            <th>Price</th>
                            <th>Status</th>
                            <th>Date Applied</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${apps.map(a => `
                            <tr>
                                <td><strong>${a.property_title}</strong><br>
                                    <small style="color:#6c757d;">${a.property_type}</small>
                                </td>
                                <td>${a.property_location}, ${a.property_state}</td>
                                <td>${formatPrice(a.property_price)}/yr</td>
                                <td>${statusBadge(a.status)}</td>
                                <td>${formatDate(a.applied_at)}</td>
                                <td>
                                    <a href="/property-detail/?id=${a.property_id}"
                                        class="btn btn-outline"
                                        style="padding:0.3rem 0.8rem; font-size:0.8rem;">
                                        View
                                    </a>
                                </td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>`;
        }

        document.addEventListener('DOMContentLoaded', loadApplications);
    </script>
</body>
</html>
